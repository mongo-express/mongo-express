name: Release built version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish_package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install modules
        run: yarn install --frozen-lockfile
      - name: Build release
        run: yarn build
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: mongo-express-*.tgz
          tag_name: ${{inputs.tag}}
